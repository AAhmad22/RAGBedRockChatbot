name: Deploy

# Deploys infrastructure on merge to main using GitHub OIDC to assume an AWS
# role. No long-lived AWS access keys are stored in GitHub secrets.
#
# One-time setup in your AWS account:
#   1. Create an IAM OIDC identity provider for token.actions.githubusercontent.com
#   2. Create a deploy role with a trust policy scoped to this repo
#   3. Store its ARN as the repo variable AWS_DEPLOY_ROLE_ARN

on:
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: CDK deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node (for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK + infra deps
        run: |
          npm install -g aws-cdk
          pip install -r infra/requirements.txt

      - name: CDK deploy
        working-directory: infra
        run: cdk deploy --require-approval never
